spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Override production JWT settings for tests
jwt:
  secret: test-secret-key-for-unit-tests-only-123456789
  expiration: 3600000
  refresh-expiration: 7200000

# Reduce logging noise in tests
logging:
  level:
    com.slash: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.flywaydb: OFF
    root: WARN
