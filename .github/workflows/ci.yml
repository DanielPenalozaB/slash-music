name: CI Build Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # Note: Tests use H2 in-memory database, so no PostgreSQL service needed

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # BUILD CHECK: Compile the application
    - name: Compile application
      run: ./gradlew compileJava compileTestJava

    # BUILD CHECK: Run all tests
    - name: Run tests
      run: ./gradlew test --info
      env:
        SPRING_PROFILES_ACTIVE: test

    # BUILD CHECK: Generate test report
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: build/test-results/**/*.xml
        comment_mode: off

    # BUILD CHECK: Build the application (creates JAR)
    - name: Build application
      run: ./gradlew build -x test -x spotbugsMain

    # BUILD CHECK: Verify JAR was created and is valid
    - name: List build artifacts
      run: |
        echo "Checking for JAR files in build/libs/"
        ls -la build/libs/ || echo "No JARs found"

    # BUILD CHECK: Basic smoke test - check if app starts
    - name: Verify JAR creation
      run: |
        if find build/libs -name "*.jar" | grep -q .; then
          echo "JAR file successfully created"
          ls -la build/libs/
        else
          echo "JAR file not found"
          exit 1
        fi

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # CODE QUALITY CHECK: Run Checkstyle (fail fast on style violations)
    - name: Run Checkstyle
      run: ./gradlew checkstyleMain checkstyleTest

    # CODE QUALITY CHECK: Run SpotBugs (allow to fail, report issues)
    - name: Run SpotBugs
      run: ./gradlew spotbugsMain
      continue-on-error: true

    # SECURITY CHECK: Dependency vulnerability scan (allow to fail, report issues)
    - name: Run dependency check
      run: ./gradlew dependencyCheckAnalyze
      continue-on-error: true