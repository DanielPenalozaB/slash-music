name: CI Build Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: slash_db
          POSTGRES_USER: slash_db_user
          POSTGRES_PASSWORD: slash_db_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # BUILD CHECK: Compile the application
    - name: Compile application
      run: ./gradlew compileJava compileTestJava

    # BUILD CHECK: Run all tests
    - name: Run tests
      run: ./gradlew test
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/slash_db
        SPRING_DATASOURCE_USERNAME: slash_db_user
        SPRING_DATASOURCE_PASSWORD: slash_db_password

    # BUILD CHECK: Generate test report
    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: |
          build/test-results/**/*.xml

    # BUILD CHECK: Build the application (creates JAR)
    - name: Build application
      run: ./gradlew build -x test

    # BUILD CHECK: Verify JAR was created and is valid
    - name: Verify JAR creation
      run: |
        if [ -f build/libs/*.jar ]; then
          echo "✅ JAR file successfully created"
          ls -la build/libs/
        else
          echo "❌ JAR file not found"
          exit 1
        fi

    # BUILD CHECK: Basic smoke test - check if app starts
    - name: Smoke test - Application startup
      run: |
        timeout 30s java -jar build/libs/*.jar --spring.datasource.url=jdbc:h2:mem:testdb --spring.jpa.hibernate.ddl-auto=create-drop --spring.flyway.enabled=false &
        APP_PID=$!
        sleep 10
        if kill -0 $APP_PID 2>/dev/null; then
          echo "✅ Application started successfully"
          kill $APP_PID
        else
          echo "❌ Application failed to start"
          exit 1
        fi

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    # CODE QUALITY CHECK: Run Checkstyle
    - name: Run Checkstyle
      run: ./gradlew checkstyleMain checkstyleTest
      continue-on-error: true

    # CODE QUALITY CHECK: Run SpotBugs
    - name: Run SpotBugs
      run: ./gradlew spotbugsMain
      continue-on-error: true

    # SECURITY CHECK: Dependency vulnerability scan
    - name: Run dependency check
      run: ./gradlew dependencyCheckAnalyze
      continue-on-error: true